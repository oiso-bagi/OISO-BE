# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'
early_access: false

tone_instructions: |
  한국어로 간결하고 건설적인 코드 리뷰를 제공해 주세요.
  실제 버그, 보안, 데이터 무결성, 장애 가능성, 유지보수 리스크를 우선적으로 지적해 주세요.
  단순 취향이나 과한 추상화 제안은 피하고, 이 프로젝트의 NestJS, Prisma, Jest, PostgreSQL 구조를 기준으로 판단해 주세요.
  리뷰 코멘트에는 가능한 경우 재현 조건, 영향 범위, 수정 방향을 함께 적어 주세요.

reviews:
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  assess_linked_issues: false
  related_prs: false
  related_issues: false
  suggested_labels: true
  sequence_diagrams: false
  changed_files_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_placeholder: 'PR의 주요 변경 사항을 요약합니다.'
  collapse_walkthrough: true
  commit_status: true
  fail_commit_status: false
  abort_on_close: true

  path_filters:
    # 포함(allow-list)
    - 'src/**'
    - 'prisma/**'
    - 'test/**'
    - '.github/**'
    - 'docs/**'
    - 'workflows/**'
    - 'AGENTS.md'
    - 'README.md'
    - 'package.json'
    - 'tsconfig*.json'
    - 'eslint.config.mjs'
    - 'nest-cli.json'
    - 'docker-compose.yml'
    - '.prettierrc'
    # 제외(deny-list)
    - '!.coderabbit.yaml'
    - '!package-lock.json'
    - '!pnpm-lock.yaml'
    - '!node_modules/**'
    - '!dist/**'
    - '!coverage/**'
    - '!prisma/erd.svg'
    - '!**/*.svg'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!**/*.avif'
    - '!**/*.mp4'
    - '!**/*.webm'
    - '!**/*.mp3'
    - '!**/*.ogg'

  path_instructions:
    - path: 'src/**/*.ts'
      instructions: |
        NestJS 백엔드 TypeScript 코드를 리뷰할 때는 다음을 우선 확인해 주세요.
        - 컨트롤러, 서비스, 리포지토리, DTO, 모듈의 책임이 분리되어 있는지 확인합니다.
        - 런타임 예외로 이어질 수 있는 null/undefined 접근, 잘못된 타입 변환, 비동기 처리 누락을 우선 지적합니다.
        - Promise를 fire-and-forget으로 흘려보내거나 예외를 삼키는 코드가 있는지 확인합니다.
        - 외부 입력값이 DTO, 파이프, 서비스 경계에서 검증되는지 확인합니다.
        - Prisma 쿼리 결과가 없을 수 있는 경우를 명시적으로 처리하는지 확인합니다.
        - 생성, 수정, 삭제 로직에서 권한 확인과 데이터 소유권 확인이 필요한지 검토합니다.
        - `any` 사용 자체보다 실제 타입 안정성 저하나 런타임 위험이 있는 사용을 중심으로 지적합니다.

    - path: 'src/**/*.controller.ts'
      instructions: |
        NestJS 컨트롤러 변경을 리뷰할 때는 다음을 확인해 주세요.
        - HTTP 메서드, 라우트 경로, 상태 코드가 API 의도와 일치하는지 확인합니다.
        - request body, path param, query param의 타입 변환과 검증이 충분한지 확인합니다.
        - 컨트롤러에 비즈니스 로직이나 데이터 접근 로직이 과도하게 들어가지 않았는지 확인합니다.
        - 응답 DTO 또는 응답 형태가 기존 API 계약과 호환되는지 확인합니다.
        - 민감한 내부 오류, stack trace, DB 상세 정보가 응답으로 노출되지 않는지 확인합니다.

    - path: 'src/**/*.service.ts'
      instructions: |
        서비스 레이어 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 도메인 규칙과 예외 처리가 일관되게 적용되는지 확인합니다.
        - 리포지토리 호출 결과가 없는 경우, 중복 데이터, 잘못된 상태 전이를 처리하는지 확인합니다.
        - 여러 DB 쓰기가 하나의 작업 단위여야 하는 경우 트랜잭션이 필요한지 검토합니다.
        - 시간, 비용, 거리, 정렬 순서처럼 계산 결과가 사용자에게 노출되는 값의 단위와 경계값을 확인합니다.
        - 서비스가 컨트롤러나 HTTP 세부 구현에 과도하게 의존하지 않는지 확인합니다.

    - path: 'src/**/*.repository.ts'
      instructions: |
        리포지토리와 Prisma 쿼리를 리뷰할 때는 다음을 확인해 주세요.
        - `findUnique`, `findFirst`, `update`, `delete`의 where 조건이 실제 유니크 제약 및 인덱스와 맞는지 확인합니다.
        - N+1 쿼리, 불필요하게 큰 include/select, 정렬 없는 페이지네이션 같은 성능 리스크를 확인합니다.
        - 삭제나 수정 쿼리가 의도보다 넓은 범위에 적용될 가능성이 없는지 확인합니다.
        - Decimal, DateTime, Json 필드를 API 응답으로 내보낼 때 직렬화 문제가 없는지 확인합니다.
        - Prisma 예외를 호출 계층에서 의미 있는 도메인 오류로 바꿔 처리하는지 확인합니다.

    - path: 'src/**/dto/**/*.ts'
      instructions: |
        DTO 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 요청 DTO는 필수/선택 필드, 타입, 범위, enum 값이 API 의도와 일치하는지 확인합니다.
        - 응답 DTO는 Prisma 모델을 그대로 노출하지 않고 필요한 필드만 포함하는지 확인합니다.
        - 비용, 거리, 시간, 좌표 같은 값의 단위가 이름이나 문서에서 분명한지 확인합니다.
        - 비밀번호, 토큰, 내부 식별자, 운영 정보 같은 민감한 값이 응답 DTO에 포함되지 않는지 확인합니다.

    - path: 'src/prisma/**'
      instructions: |
        Prisma 모듈과 서비스 변경을 리뷰할 때는 다음을 확인해 주세요.
        - PrismaClient 생명주기 연결/해제가 NestJS 애플리케이션 생명주기와 맞는지 확인합니다.
        - 환경 변수와 DB 연결 설정이 코드에 하드코딩되지 않았는지 확인합니다.
        - 테스트와 운영 환경에서 DB 연결 방식이 의도치 않게 섞이지 않는지 확인합니다.

    - path: 'prisma/schema.prisma'
      instructions: |
        Prisma 스키마 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 모델 관계, onDelete 동작, unique/index 제약이 실제 서비스 로직과 맞는지 확인합니다.
        - 필수 필드 추가, enum 값 변경, 컬럼 타입 변경처럼 기존 데이터에 영향을 주는 변경은 마이그레이션 위험을 명시합니다.
        - Decimal, DateTime, Json 타입의 정밀도와 API 직렬화 영향을 검토합니다.
        - 쿼리 패턴상 필요한 인덱스가 빠져 있거나 불필요한 인덱스가 추가되지 않았는지 확인합니다.
        - 사용자 개인정보, 위치 정보, 동의 내역처럼 민감한 데이터 모델의 보존 기간과 접근 경계를 고려합니다.

    - path: 'prisma/migrations/**'
      instructions: |
        Prisma migration 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 마이그레이션 SQL이 `schema.prisma` 변경과 일치하는지 확인합니다.
        - 기존 데이터가 있는 환경에서 실패할 수 있는 NOT NULL 추가, enum 변경, 컬럼 삭제, unique 제약 추가를 우선 지적합니다.
        - 되돌리기 어려운 destructive change가 있으면 배포 전 백업, 단계적 배포, 데이터 보정 필요성을 언급합니다.
        - 인덱스 추가/삭제가 운영 DB 잠금이나 성능에 미칠 영향을 확인합니다.

    - path: 'test/**/*.ts'
      instructions: |
        Jest e2e 테스트 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 테스트가 실제 API 계약, 상태 코드, 주요 응답 필드를 검증하는지 확인합니다.
        - 테스트 간 DB 상태가 공유되어 순서 의존성이 생기지 않는지 확인합니다.
        - 성공 케이스뿐 아니라 잘못된 입력, 리소스 없음, 권한 문제 같은 실패 케이스가 필요한지 검토합니다.

    - path: 'src/**/*.spec.ts'
      instructions: |
        Jest 단위 테스트 변경을 리뷰할 때는 다음을 확인해 주세요.
        - 테스트가 구현 세부보다 관찰 가능한 동작과 예외 케이스를 검증하는지 확인합니다.
        - mock이 실제 NestJS provider 구조와 지나치게 다르지 않은지 확인합니다.
        - 비동기 테스트에서 `await` 누락이나 잘못된 rejection 검증이 없는지 확인합니다.

    - path: '.github/**'
      instructions: |
        GitHub 템플릿과 워크플로 변경을 리뷰할 때는 다음을 확인해 주세요.
        - PR 템플릿이 작업 배경, API 변경, DB migration, 테스트 결과를 충분히 남기게 하는지 확인합니다.
        - GitHub Actions가 추가되면 NestJS 프로젝트에 맞게 의존성 설치, lint, build, test 순서가 구성되어 있는지 확인합니다.
        - secret이나 환경 변수가 로그 또는 설정 파일에 노출되지 않는지 확인합니다.

    - path: 'docker-compose.yml'
      instructions: |
        Docker Compose 변경을 리뷰할 때는 다음을 확인해 주세요.
        - PostgreSQL 버전, 포트, 볼륨, healthcheck가 로컬 개발 목적에 맞는지 확인합니다.
        - DB 계정, 비밀번호, DB 이름은 `.env` 기반으로 주입되고 하드코딩되지 않는지 확인합니다.
        - 볼륨 삭제나 포트 변경처럼 로컬 데이터 손실 또는 개발 환경 충돌을 일으킬 수 있는 변경을 명시합니다.

    - path: 'package.json'
      instructions: |
        package.json 변경을 리뷰할 때는 다음을 확인해 주세요.
        - NestJS, Prisma, Jest, ESLint 스크립트가 현재 프로젝트 구조와 일치하는지 확인합니다.
        - 런타임 의존성과 개발 의존성이 적절히 구분되어 있는지 확인합니다.
        - 의존성 추가가 실제 사용 코드와 연결되는지, 보안 또는 유지보수 리스크가 큰 패키지는 아닌지 확인합니다.
        - `npm`과 `pnpm` lockfile이 함께 있는 상태에서 설치 명령과 lockfile 정책이 혼재되지 않는지 확인합니다.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'develop'
      - 'main'
    labels:
      - '!wip'
      - '!draft'
      - '!skip-review'
    ignore_usernames:
      - 'dependabot'
      - 'renovate'
    ignore_title_keywords:
      - '[skip-review]'

  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: 'PR 제목은 `type: 작업 내용 (#이슈번호)` 형식을 사용합니다. 사소한 변경으로 이슈가 없으면 `type: 작업 내용 (no-issue)` 형식을 사용합니다.'
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'off'

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    eslint:
      enabled: true
    languagetool:
      enabled: true
      level: 'default'
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true

chat:
  art: false
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - 'README.md'
      - '.github/pull_request_template.md'
      - 'prisma/schema.prisma'
      - 'docs/**/*.md'
