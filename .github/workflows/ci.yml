name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify NestJS backend
    runs-on: ubuntu-latest

    env:
      PRISMA_CLIENT_ENGINE_TYPE: binary
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/oiso"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/oiso"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Ensure lint did not modify files
        run: git diff --exit-code

      - name: Build
        run: pnpm run build:raw

      - name: Run unit tests
        run: pnpm run test
