name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify NestJS backend
    runs-on: ubuntu-latest

    env:
      PRISMA_CLIENT_ENGINE_TYPE: binary

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Ensure lint did not modify files
        run: git diff --exit-code

      - name: Run unit tests
        run: npm run test
